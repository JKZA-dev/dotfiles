name: Test Ansible

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install ansible ansible-lint

      - name: Run ansible-lint
        working-directory: ./ansible
        run: ansible-lint setup.yml

      - name: Send failure email
        if: failure() && github.event_name == 'push'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          subject: "[dotfiles] ❌ Linting failed on ${{ github.ref_name }}"
          body: |
            Ansible linting failed!

            Repository: ${{ github.repository }}
            Branch:     ${{ github.ref_name }}
            Commit:     ${{ github.sha }}
            Author:     ${{ github.actor }}
            Message:    ${{ github.event.head_commit.message }}

            View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

  test-desktop:
    name: Molecule – Desktop
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule and dependencies
        run: pip install ansible "molecule-plugins[docker]" docker

      - name: Run Molecule desktop scenario
        working-directory: ./ansible
        env:
          DOTFILES_DIR: ${{ github.workspace }}
        run: molecule test -s desktop

      - name: Send failure email
        if: failure() && github.event_name == 'push'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          subject: "[dotfiles] ❌ Desktop scenario failed on ${{ github.ref_name }}"
          body: |
            Molecule desktop scenario test failed!

            Repository: ${{ github.repository }}
            Branch:     ${{ github.ref_name }}
            Commit:     ${{ github.sha }}
            Author:     ${{ github.actor }}
            Message:    ${{ github.event.head_commit.message }}

            View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

  test-server:
    name: Molecule – Server
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule and dependencies
        run: pip install ansible "molecule-plugins[docker]" docker

      - name: Run Molecule server scenario
        working-directory: ./ansible
        env:
          DOTFILES_DIR: ${{ github.workspace }}
        run: molecule test -s server

      - name: Send failure email
        if: failure() && github.event_name == 'push'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          subject: "[dotfiles] ❌ Server scenario failed on ${{ github.ref_name }}"
          body: |
            Molecule server scenario test failed!

            Repository: ${{ github.repository }}
            Branch:     ${{ github.ref_name }}
            Commit:     ${{ github.sha }}
            Author:     ${{ github.actor }}
            Message:    ${{ github.event.head_commit.message }}

            View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
