---
# GitHub Actions Workflow – Ansible Molecule Tests
#
# Führt automatisch Molecule-Tests aus bei:
#   - Push auf main oder develop
#   - Pull Requests auf main oder develop
#   - Manuellem Trigger (Actions-Tab → "Run workflow")
#
# Szenarien:
#   desktop – Vollständiges KDE-Setup (Pakete, ZSH, Dotfiles, SSH, Backgrounds)
#   server  – Minimales Server-Setup (Pakete, ZSH, Dotfiles, SSH – kein GUI)
#
# Beide Szenarien laufen PARALLEL für schnelleres Feedback.

name: Ansible Molecule Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      scenario:
        description: "Molecule-Szenario (desktop, server oder leer für beide)"
        required: false
        default: ""

jobs:
  # ================================================================== #
  # Schnelle Prüfung (Sekunden): Syntax/Lint für YAML, Ansible, Shell. #
  # Fängt die meisten Fehler ab, bevor die langsamen Container starten.#
  # ================================================================== #
  lint:
    name: "Lint & Syntax"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Lint-Werkzeuge installieren
        run: |
          pip install ansible-core ansible-lint yamllint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: yamllint .

      - name: Ansible Syntax-Check
        run: ansible-playbook --syntax-check -i ansible/inventory.ini ansible/setup.yml

      - name: ansible-lint
        run: ansible-lint

      - name: shellcheck (eigene Skripte)
        run: shellcheck run-ansible.sh ansible/roles/ssh_config/tasks/generate_ssh_key.sh

  molecule:
    name: "Molecule [${{ matrix.scenario }}]"
    needs: lint   # erst die langsamen Container starten, wenn Lint grün ist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        scenario:
          - desktop
          - server
      fail-fast: false  # Weiterlaufen auch wenn ein Szenario fehlschlägt

    steps:
      # ---------------------------------------------------------------- #
      # Repository auschecken                                             #
      # ---------------------------------------------------------------- #
      - name: Repository auschecken
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- #
      # Python einrichten                                                 #
      # ---------------------------------------------------------------- #
      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ---------------------------------------------------------------- #
      # Podman installieren und konfigurieren                             #
      # ---------------------------------------------------------------- #
      - name: Podman installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Podman-Version prüfen
        run: podman version

      # ---------------------------------------------------------------- #
      # Python-Abhängigkeiten installieren                                #
      # ---------------------------------------------------------------- #
      - name: Python-Abhängigkeiten installieren
        run: pip install -r requirements.txt

      # ---------------------------------------------------------------- #
      # Molecule-Test ausführen                                           #
      # ---------------------------------------------------------------- #
      - name: "Molecule test – ${{ matrix.scenario }}"
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          # Podman-spezifische Konfiguration für CI
          MOLECULE_DRIVER_NAME: podman

      # # ---------------------------------------------------------------- #
      # # E-Mail-Benachrichtigung bei Fehler (nur bei Push-Events)          #
      # # ---------------------------------------------------------------- #
      # - name: "E-Mail bei Fehler senden – ${{ matrix.scenario }}"
      #   if: >-
      #     failure() &&
      #     github.event_name == 'push' &&
      #     secrets.MAIL_SERVER != '' &&
      #     secrets.MAIL_TO != '' &&
      #     secrets.MAIL_FROM != '' &&
      #     secrets.MAIL_USERNAME != ''
      #   uses: dawidd6/action-send-mail@v3
      #   continue-on-error: true
      #   with:
      #     server_address: ${{ secrets.MAIL_SERVER }}
      #     server_port: 587
      #     secure: false
      #     username: ${{ secrets.MAIL_USERNAME }}
      #     password: ${{ secrets.MAIL_PASSWORD }}
      #     subject: "❌ Ansible Molecule Test Failed - ${{ matrix.scenario }} - ${{ github.ref_name }}"
      #     to: ${{ secrets.MAIL_TO }}
      #     from: ${{ secrets.MAIL_FROM }}
      #     body: |
      #       Ansible Molecule test failed!

      #       Scenario:  ${{ matrix.scenario }}
      #       Branch:    ${{ github.ref_name }}
      #       Commit:    ${{ github.sha }}
      #       Author:    ${{ github.actor }}

      #       View the failed workflow run:
      #       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      # ---------------------------------------------------------------- #
      # Logs bei Fehler hochladen (für Debugging)                         #
      # ---------------------------------------------------------------- #
      - name: Molecule-Logs bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molecule-logs-${{ matrix.scenario }}-${{ github.run_id }}
          path: |
            ~/.cache/molecule/
            /tmp/molecule/
          retention-days: 30
          if-no-files-found: ignore

      # ---------------------------------------------------------------- #
      # Container aufräumen (auch bei Fehler)                             #
      # ---------------------------------------------------------------- #
      - name: Container aufräumen
        if: always()
        run: molecule destroy -s ${{ matrix.scenario }} || true
        env:
          PY_COLORS: "1"
