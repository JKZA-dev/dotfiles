---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: yamllint .
      - run: ansible-lint
      - run: git ls-files -z '*.sh' ':!:kde/' | xargs -0 shellcheck

  molecule:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [desktop, server]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq podman
      - run: pip install -r requirements.txt
      - run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  macos:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: brew install ansible
      - run: ansible-galaxy collection install -r requirements.yml
        working-directory: ansible
      - run: >-
          ansible-playbook setup.yml --extra-vars
          '{"install_mode":"server","gaming":false,"neovim_bootstrap":false,"dotfiles_dir":"${{ github.workspace }}"}'
        working-directory: ansible
      - name: Shell starts without errors
        run: test -z "$(zsh -i -c exit 2>&1 >/dev/null)"
