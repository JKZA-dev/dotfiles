---
- name: Provision workstation
  hosts: all
  roles:
    - { role: packages, tags: packages }
    - { role: shell, tags: shell }
    - { role: dotfiles, tags: dotfiles }
    - { role: neovim, tags: neovim }
    - { role: ssh, tags: ssh }
    - role: kde
      tags: kde
      when: install_mode == 'desktop' and ansible_facts.distribution == 'Fedora'
    - role: macos
      tags: macos
      when: install_mode == 'desktop' and ansible_facts.distribution == 'MacOSX'
