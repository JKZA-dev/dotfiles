---
- name: Create ~/.ssh
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.ssh"
    state: directory
    mode: "0700"

- name: Add known hosts
  ansible.builtin.known_hosts:
    path: "{{ ansible_facts.user_dir }}/.ssh/known_hosts"
    name: "{{ item.split()[0] }}"
    key: "{{ item }}"
  loop: "{{ lookup('ansible.builtin.file', 'known_hosts').splitlines() }}"
  loop_control:
    label: "{{ item.split()[:2] | join(' ') }}"
