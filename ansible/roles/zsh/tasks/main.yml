# Rolle: zsh – ZSH als Standard-Shell setzen
#
# Oh-My-Zsh, Powerlevel10k und alle Plugins liegen bereits im Repo
# unter zsh/.oh-my-zsh/ und werden von der "dotfiles"-Rolle per Stow verlinkt:
#
#   ~/dotfiles/zsh/.zshrc              → ~/.zshrc
#   ~/dotfiles/zsh/.oh-my-zsh/custom/  → ~/.oh-my-zsh/custom/
#     (enthält Powerlevel10k, zsh-autosuggestions, aliases.zsh, etc.)
#
# Diese Rolle setzt nur noch ZSH als Standard-Shell.
# Die Verlinkung findest du in: ansible/roles/dotfiles/tasks/main.yml
---

- name: "ZSH als Standard-Shell setzen"
  become: true
  ansible.builtin.user:
    name: "{{ local_user }}"
    shell: /bin/zsh
