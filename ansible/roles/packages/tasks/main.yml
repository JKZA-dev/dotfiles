# Rolle: packages – System-Pakete installieren
#
# Installiert Basis-Pakete (immer) und Desktop-Pakete (nur im Desktop-Modus).
# "state: present" = installiere falls nicht vorhanden, überspringe sonst.
---

# Basis-Pakete – werden IMMER installiert (Desktop + Server)

- name: "Basis-Pakete installieren"
  become: true
  ansible.builtin.dnf5:
    name:
      - zsh
      - git
      - stow
      - curl
      - zip
      - btop
      - fastfetch
      - neovim
      - python3-pip
      - python3-packaging
      - ninja-build
      - cmatrix
      - lolcat
      - yt-dlp
      - Tmux
    state: present


# Desktop-Pakete (leicht) – nur im Desktop-Modus.
# gimp dient auch im Molecule-Test als Beleg, dass der Desktop-Zweig
# wirklich GUI-Pakete installiert (siehe verify.yml).

- name: "Desktop-Pakete installieren (Basis)"
  become: true
  ansible.builtin.dnf5:
    name:
      - gimp
    state: present
  when: install_mode == 'desktop'


# Desktop-Pakete (schwer) – im Container-Test übersprungen, damit die CI
# schnell und stabil bleibt. Auf echten Maschinen werden sie installiert.

- name: "Desktop-Pakete installieren (schwer)"
  become: true
  ansible.builtin.dnf5:
    name:
      - kicad
      - plasma-browser-integration
      - applet-window-buttons
    state: present
  when:
    - install_mode == 'desktop'
    - not molecule_test | default(false)


# Gaming-Pakete – nur Desktop + Gaming-Ready ausgewählt (Steam)

- name: "Gaming-Pakete installieren (Steam)"
  become: true
  ansible.builtin.dnf5:
    name:
      - Steam
    state: present
  when:
    - install_mode == 'desktop'
    - game_ready | default(false)
    - not molecule_test | default(false)


# Microsoft Edge – nur Desktop (nicht im Container-Test: externes Repo)

- name: "Prüfen ob Microsoft Edge Repository existiert"
  ansible.builtin.stat:
    path: /etc/yum.repos.d/microsoft-edge.repo
  register: edge_repo
  when:
    - install_mode == 'desktop'
    - not molecule_test | default(false)

- name: "Microsoft Edge Repository hinzufügen"
  become: true
  ansible.builtin.yum_repository:
    name: microsoft-edge
    description: "Microsoft Edge Browser"
    baseurl: "https://packages.microsoft.com/yumrepos/edge"
    gpgcheck: true
    gpgkey: "https://packages.microsoft.com/keys/microsoft.asc"
    enabled: true
  when:
    - install_mode == 'desktop'
    - not molecule_test | default(false)
    - not (edge_repo.stat.exists | default(false))

- name: "Microsoft Edge installieren"
  become: true
  ansible.builtin.dnf5:
    name: microsoft-edge-stable
    state: present
  when:
    - install_mode == 'desktop'
    - not molecule_test | default(false)


# speedtest-cli per pip (immer)
# --break-system-packages: Fedoras System-Python ist "externally managed"
# (PEP 668), pip verweigert sonst die Installation.

- name: "speedtest-cli per pip installieren"
  ansible.builtin.pip:
    name: speedtest-cli
    extra_args: --user --break-system-packages


# Flatpak – nur Desktop (nicht im Container-Test: benötigt flatpak-Binary)

- name: "Flathub Remote hinzufügen"
  become: true
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: "https://dl.flathub.org/repo/flathub.flatpakrepo"
    method: system
  when:
    - install_mode == 'desktop'
    - not molecule_test | default(false)

- name: "Desktop-Flatpaks installieren"
  become: true
  community.general.flatpak:
    name:
      - im.riot.Riot                       # Element (Matrix-Client)
      - com.github.tchx84.Flatseal         # Flatseal (Flatpak-Berechtigungen)
      - com.ktechpit.whatsie                # Whatsie (WhatsApp-Client)
      - com.discordapp.Discord             # Discord
    state: present
    method: system
  when:
    - install_mode == 'desktop'
    - not molecule_test | default(false)


# Gaming-Flatpaks – nur Desktop + Gaming-Ready ausgewählt (Prism Launcher)

- name: "Gaming-Flatpaks installieren (Prism Launcher)"
  become: true
  community.general.flatpak:
    name:
      - org.prismlauncher.PrismLauncher   # Prism Minecraft Launcher
    state: present
    method: system
  when:
    - install_mode == 'desktop'
    - (game_ready | default(false)) | bool
    - not molecule_test | default(false)
