---
- name: Load package lists for this OS
  ansible.builtin.include_vars: "{{ ansible_facts.distribution }}.yml"

- name: Select package groups for this mode
  ansible.builtin.set_fact:
    packages_groups: >-
      {{ ['base']
         + ((['desktop']
             + (['desktop_heavy'] if packages_heavy else [])
             + (['gaming'] if gaming else []))
            if install_mode == 'desktop' else []) }}

- name: Install packages for this OS
  ansible.builtin.include_tasks: "{{ ansible_facts.distribution }}.yml"
  vars:
    packages_selected_native: "{{ packages_groups | map('extract', packages_native) | flatten }}"
    packages_selected_apps: "{{ packages_groups | map('extract', packages_apps) | flatten }}"
