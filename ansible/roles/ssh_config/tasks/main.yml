# Rolle: ssh_config – SSH-Dateien einrichten
#
# Erstellt ~/.ssh/ mit korrekten Berechtigungen und kopiert known_hosts.
# Die SSH-Key Generierung übernimmt run-ansible.sh interaktiv am Ende des Setups.
---

# SSH ist streng bei Berechtigungen:
# ~/.ssh/ muss 0700 sein (nur Besitzer darf rein)

- name: "~/.ssh/ erstellen (mode 0700)"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: "known_hosts kopieren"
  ansible.builtin.copy:
    src: "{{ dotfiles_dir }}/ssh/.ssh/known_hosts"
    dest: "{{ ansible_env.HOME }}/.ssh/known_hosts"
    remote_src: true   # Quelle liegt auf dem Zielsystem (geklontes Repo / Container)
    mode: "0644"
