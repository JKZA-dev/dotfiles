---
- name: Check for unmanaged shell files
  ansible.builtin.stat:
    path: "{{ ansible_facts.user_dir }}/{{ item }}"
  loop: "{{ dotfiles_backup_files }}"
  register: dotfiles_existing

- name: Back up unmanaged shell files
  ansible.builtin.command:
    cmd: mv {{ item.item }} {{ item.item }}.bak
    chdir: "{{ ansible_facts.user_dir }}"
  changed_when: true
  loop: "{{ dotfiles_existing.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists and not item.stat.islnk

# --no-folding: directory symlinks would let apps write into the repo.
- name: Link stow packages
  ansible.builtin.command:
    cmd: >-
      stow --no-folding --verbose --ignore=.DS_Store
      --dir={{ dotfiles_dir }}/stow --target={{ ansible_facts.user_dir }} {{ item }}
  loop: "{{ dotfiles_stow_packages + (dotfiles_stow_packages_desktop if install_mode == 'desktop' else []) }}"
  register: dotfiles_stow
  changed_when: "'LINK:' in dotfiles_stow.stderr"
