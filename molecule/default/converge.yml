---
# Converge – Führt das Ansible-Playbook aus
#
# Importiert das Haupt-Playbook (ansible/setup.yml). Die Modi (Desktop vs
# Server) werden über install_mode gesteuert, das in molecule.yml gesetzt wird.
#
# Die Container-Vorbereitung (python3/libdnf5/sudo, Dotfiles kopieren) passiert
# in prepare.yml, damit converge idempotent bleibt (Molecule führt converge ein
# zweites Mal aus und erwartet 0 Änderungen).
- name: Converge – Import ansible/setup.yml
  ansible.builtin.import_playbook: ../../ansible/setup.yml
